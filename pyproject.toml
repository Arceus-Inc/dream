[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dream"
version = "0.1.0"
description = "An SDK for building autonomous agent harnesses."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Arceus-Inc" }]
keywords = ["agent", "harness", "llm", "sdk", "autonomous"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7",
  "anyio>=4.4",
  "httpx>=0.27",
  "idna>=3.15",
  "croniter>=2.0",
  "jsonschema>=4.0",
  "pyyaml>=6.0",
  # 2.x renames the client entrypoints this repo's opener/session code targets.
  "mcp>=1.0,<2",
  "websockets>=12.0",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai    = ["openai>=1.50"]
docker    = ["docker>=7.1"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-jsonschema>=4.0",
  "types-pyyaml>=6.0",
]

[project.urls]
Homepage       = "https://github.com/Arceus-Inc/dream"
Repository     = "https://github.com/Arceus-Inc/dream"
Documentation  = "https://github.com/Arceus-Inc/dream/tree/main/consumer-facing-api"
Issues         = "https://github.com/Arceus-Inc/dream/issues"
Changelog      = "https://github.com/Arceus-Inc/dream/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/dream"]

[tool.hatch.build.targets.wheel.force-include]
"src/dream/prompts/standing_orders.md" = "dream/prompts/standing_orders.md"

[tool.hatch.build.targets.sdist]
include = ["src/dream", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dream"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# Optional-extra dependencies — not present unless installed via
# ``pip install 'dream[openai]'`` / ``[anthropic]``. The adapter modules
# under ``src/dream/api/`` import them only inside ``TYPE_CHECKING`` blocks
# or lazily inside ``_build_client``; treat the missing stubs as ignored
# so the strict run passes against the lean default install.
[[tool.mypy.overrides]]
module = ["openai", "openai.*", "anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-q", "--strict-markers"]
markers = [
    "eval: correctness evals for durable behaviour",
]
